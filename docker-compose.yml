services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/database

  backend:
    build:
      context: ./backend
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://localhost:27017/test
      FRONTEND_URL: http://localhost:8080
      JWT_SECRET: your_jwt_secret
      PORT: 5000
      NODE_ENV: production
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev:with-build

  frontend:
    build:
      context: ./frontend
    container_name: mern-frontend
    ports:
      - "8080:80"
    environment:
      VITE_BACKEND_URL: http://localhost:5000
      VITE_PORT: 8080
    depends_on:
      - backend


volumes:
  mongo-data:
